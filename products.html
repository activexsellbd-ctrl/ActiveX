<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products | ActiveX</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
font-family:Poppins,sans-serif;
background:#f5f7fa;
margin:0;
}

header{
background:#062B6F;
padding:18px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.search input{
padding:12px;
width:320px;
border:none;
border-radius:8px;
}

.products{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:40px;

}

.card{

background:white;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.12);
padding:20px;
text-align:center;
transition:.3s;

}

.card:hover{

transform:translateY(-8px);

}

.card img{

width:180px;
height:180px;
object-fit:cover;

}

.price{

font-size:22px;
font-weight:bold;
color:#062B6F;

}

.rating{

color:orange;
margin:10px;

}

button{

padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
margin:5px;
font-weight:bold;

}

.cart{

background:#52D11F;
color:white;

}

.view{

background:#062B6F;
color:white;

}

</style>

</head>

<body>

<header>

<div class="logo">

ActiveX

</div>

<div class="search">

<input
type="text"
placeholder="Search Products...">

</div>

</header>

<section class="products">

<div class="card">

<img src="assets/products/jersey.jpg">

<h3>Football Jersey</h3>

<p class="price">

৳1499

</p>

<div class="rating">

⭐⭐⭐⭐⭐

</div>

<button class="cart">

Add To Cart

</button>

<button class="view"
onclick="window.location='product.html'">

View

</button>

</div>

<div class="card">

<img src="assets/products/shoes.jpg">

<h3>Running Shoes</h3>

<p class="price">

৳3499

</p>

<div class="rating">

⭐⭐⭐⭐⭐

</div>

<button class="cart">

Add To Cart

</button>

<button class="view">

View

</button>

</div>

<div class="card">

<img src="assets/products/bag.jpg">

<h3>Sports Backpack</h3>

<p class="price">

৳1999

</p>

<div class="rating">

⭐⭐⭐⭐☆

</div>

<button class="cart">

Add To Cart

</button>

<button class="view">

View

</button>

</div>

<div class="card">

<img src="assets/products/tshirt.jpg">

<h3>Training T-Shirt</h3>

<p class="price">

৳999

</p>

<div class="rating">

⭐⭐⭐⭐⭐

</div>

<button class="cart">

Add To Cart

</button>

<button class="view">

View

</button>

</div>

</section>

<script>

const search=document.querySelector("input");

search.addEventListener("keyup",()=>{

let value=search.value.toLowerCase();

document.querySelectorAll(".card").forEach(card=>{

let title=card.querySelector("h3").innerText.toLowerCase();

card.style.display=title.includes(value)?"block":"none";

});

});

</script>

</body>

</html>
