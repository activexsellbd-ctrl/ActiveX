<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ActiveX Register</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f5f7fa;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
font-family:Poppins,sans-serif;
}

.register-box{
width:500px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:80px;
}

h2{
text-align:center;
color:#062B6F;
margin-bottom:25px;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}

.input-group input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

.input-group input:focus{
border-color:#52D11F;
outline:none;
}

.checkbox{
display:flex;
align-items:center;
gap:10px;
margin:15px 0;
}

button{
width:100%;
padding:15px;
background:#062B6F;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#041f52;
}

.login-link{
text-align:center;
margin-top:20px;
}

.login-link a{
text-decoration:none;
color:#52D11F;
font-weight:bold;
}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">
<img src="assets/logo.png" alt="ActiveX">
</div>

<h2>Create ActiveX Account</h2>

<form id="registerForm">

<div class="input-group">
<label>Username</label>
<input type="text" id="username" required>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="tel" id="phone" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" required>
</div>

<div class="checkbox">
<input type="checkbox" id="terms" required>
<label for="terms">I agree to the Terms & Conditions</label>
</div>

<button type="submit">
Create Account
</button>

</form>

<div class="login-link">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit",function(e){

e.preventDefault();

const password=document.getElementById("password").value;
const confirm=document.getElementById("confirmPassword").value;

if(password!==confirm){
alert("Passwords do not match.");
return;
}

alert("Registration Successful! Please verify your email or OTP in the next step.");

window.location="otp.html";

});

</script>

</body>

</html>
