<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | ActiveX</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:#f5f7fa;
}

header{
background:#062B6F;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:40px auto;
padding:20px;
}

.notification{

background:white;
padding:20px;
margin-bottom:20px;
border-left:6px solid #52D11F;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.notification h3{
margin:0;
color:#062B6F;
}

.notification p{
margin:10px 0;
color:#555;
}

.time{
font-size:13px;
color:#999;
}

.actions{
margin-top:15px;
display:flex;
gap:10px;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.read{
background:#52D11F;
color:white;
}

.delete{
background:#ff4444;
color:white;
}

.clear{
margin-top:25px;
background:#062B6F;
color:white;
padding:14px 25px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

</style>

</head>

<body>

<header>

🔔 Notifications

</header>

<div class="container" id="list">

<div class="notification">

<h3>Order Confirmed</h3>

<p>Your order <b>#AX1001</b> has been confirmed successfully.</p>

<div class="time">

12 July 2026 • 10:30 AM

</div>

<div class="actions">

<button class="read" onclick="markRead(this)">

Mark as Read

</button>

<button class="delete" onclick="deleteNotification(this)">

Delete

</button>

</div>

</div>

<div class="notification">

<h3>Payment Received</h3>

<p>Your payment via <b>bKash</b> has been verified.</p>

<div class="time">

11 July 2026 • 08:10 PM

</div>

<div class="actions">

<button class="read" onclick="markRead(this)">

Mark as Read

</button>

<button class="delete" onclick="deleteNotification(this)">

Delete

</button>

</div>

</div>

<div class="notification">

<h3>Special Offer 🎁</h3>

<p>Get 20% OFF on ActiveX Sportswear this week.</p>

<div class="time">

10 July 2026

</div>

<div class="actions">

<button class="read" onclick="markRead(this)">

Mark as Read

</button>

<button class="delete" onclick="deleteNotification(this)">

Delete

</button>

</div>

</div>

<button class="clear" onclick="clearAll()">

Clear All Notifications

</button>

</div>

<script>

function markRead(btn){

btn.innerHTML="✓ Read";
btn.disabled=true;
btn.style.background="#888";

}

function deleteNotification(btn){

btn.closest(".notification").remove();

}

function clearAll(){

document.getElementById("list").innerHTML="<h2 style='text-align:center;color:#062B6F;'>No Notifications</h2>";

}

</script>

</body>

</html>
