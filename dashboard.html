<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | ActiveX</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:#f5f7fa;
}

header{
background:#062B6F;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{
margin:0;
}

.logout{
background:#ff4444;
color:white;
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
}

.container{
max-width:1200px;
margin:40px auto;
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
color:#062B6F;
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:bold;
color:#52D11F;
}

.recent{
margin-top:40px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#062B6F;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

.menu{
display:flex;
gap:15px;
margin-top:30px;
flex-wrap:wrap;
}

.menu a{
text-decoration:none;
background:#52D11F;
color:white;
padding:12px 18px;
border-radius:8px;
font-weight:bold;
}

.menu a:hover{
background:#43b016;
}

</style>

</head>

<body>

<header>

<h2>ActiveX User Dashboard</h2>

<button class="logout" onclick="logout()">

Logout

</button>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h3>Total Orders</h3>

<p>12</p>

</div>

<div class="card">

<h3>Wishlist</h3>

<p>8</p>

</div>

<div class="card">

<h3>Cart Items</h3>

<p>3</p>

</div>

<div class="card">

<h3>Total Spending</h3>

<p>৳24,500</p>

</div>

</div>

<div class="menu">

<a href="profile
