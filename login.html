<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ActiveX Login</title>

<style>

body{
background:#f4f6fa;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{

width:420px;
background:#fff;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.logo{

display:flex;
justify-content:center;
margin-bottom:20px;

}

.logo img{

width:70px;

}

h2{

text-align:center;
color:#062B6F;
margin-bottom:30px;

}

.input-box{

margin-bottom:20px;

}

.input-box label{

display:block;
font-weight:600;
margin-bottom:8px;

}

.input-box input{

width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;

}

.input-box input:focus{

border:1px solid #52D11F;
outline:none;

}

.btn{

width:100%;
padding:15px;
background:#062B6F;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
font-weight:600;

}

.btn:hover{

background:#041f52;

}

.links{

display:flex;
justify-content:space-between;
margin-top:20px;

}
