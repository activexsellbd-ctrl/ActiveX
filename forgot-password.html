<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | ActiveX</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f5f7fa;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Poppins,sans-serif;
}

.container{

width:450px;
background:#fff;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:80px;
}

h2{
text-align:center;
color:#062B6F;
margin-bottom:15px;
}

p{
text-align:center;
color:#555;
margin-bottom:30px;
}

.input-group{

margin-bottom:20px;

}

.input-group label{

display:block;
font-weight:600;
margin-bottom:8px;

}

.input-group input{

width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;

}

.input-group input:focus{

border-color:#52D11F;
outline:none;

}

button{

width:100%;
padding:15px;
background:#062B6F;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
font-weight:bold;

}

button:hover{

background:#041f52;

}

.links{

margin-top:20px;
display:flex;
justify-content:space-between;

}

.links a{

text-decoration:none;
color:#062B6F;
font-weight:600;

}

.links a:hover{

color:#52D11F;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="assets/logo.png">

</div>

<h2>Forgot Password</h2>

<p>

Enter your Email or Phone Number.
We'll send you an OTP.

</p>

<form id="forgotForm">

<div class="input-group">

<label>Email or Phone</label>

<input
type="text"
id="email"
placeholder="example@gmail.com or 01XXXXXXXXX"
required>

</div>

<button>

Send OTP

</button>

</form>

<div class="links">

<a href="login.html">

Back to Login

</a>

<a href="register.html">

Create Account

</a>

</div>

</div>

<script>

document
.getElementById("forgotForm")
.addEventListener("submit",function(e){

e.preventDefault();

let email=document.getElementById("email").value;

if(email==""){

alert("Please enter Email or Phone");

return;

}

alert("OTP Sent Successfully");

window.location="otp.html";

});

</script>

</body>

</html>
